<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ff8c00">
    <title>hi medha</title>
    <style>
      html { background: #ff8c00; color: #38251e; cursor: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2248%22%20height%3D%2248%22%20viewBox%3D%220%200%2048%2048%22%3E%3Cpath%20d%3D%22M8%2018%2012%2041Q24%2048%2036%2041L40%2018%22%20fill%3D%22%23faf2dd%22%20stroke%3D%22%23493027%22%20stroke-width%3D%222%22%2F%3E%3Cpath%20d%3D%22m10%2028%202%2010q12%206%2024%200l2-10q-14%206-28%200%22%20fill%3D%22%2379cda5%22%2F%3E%3Cellipse%20cx%3D%2224%22%20cy%3D%2218%22%20rx%3D%2216%22%20ry%3D%228%22%20fill%3D%22%23a2e2be%22%20stroke%3D%22%23493027%22%20stroke-width%3D%222%22%2F%3E%3Cpath%20d%3D%22M10%2017q-1-7%206-8%203-7%209-3%208-3%2010%205%205%201%204%207-13%209-29-1%22%20fill%3D%22%23b7eccb%22%20stroke%3D%22%23493027%22%20stroke-width%3D%221.5%22%2F%3E%3Cg%20fill%3D%22%23493027%22%3E%3Cpath%20d%3D%22m15%2012%204-1%201%204-4%201zM25%208l3%201-1%204-3-2zM31%2015l4-1%201%203-4%202zM21%2018l3-2%202%203-3%202zM12%2018l3-1%201%203-3%201z%22%2F%3E%3C%2Fg%3E%3Cellipse%20cx%3D%2224%22%20cy%3D%2234%22%20rx%3D%226%22%20ry%3D%224%22%20fill%3D%22%23faf2dd%22%2F%3E%3Cpath%20d%3D%22M21%2035q0-5%206-4-1%205-6%204%22%20fill%3D%22%23438864%22%2F%3E%3C%2Fsvg%3E") 24 8, auto; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; overflow: hidden; }
      h1 { margin: 24px; font: 400 clamp(48px, 12vw, 112px)/1.1 Georgia, serif; letter-spacing: -0.05em; }
      .cat { position: fixed; left: 0; top: 0; width: 70px; height: 54px; pointer-events: none; will-change: transform; }
      .cat svg { width: 100%; height: 100%; overflow: visible; }
      .cat .tail { transform-box: fill-box; transform-origin: 100% 100%; animation: tail-swish 1.25s ease-in-out infinite alternate; }
      .cat .leg { transform-box: fill-box; transform-origin: 50% 0; }
      .cat[data-phase="walk"] .leg-a, .cat[data-phase="play"] .leg-a { animation: step .32s ease-in-out infinite alternate; }
      .cat[data-phase="walk"] .leg-b, .cat[data-phase="play"] .leg-b { animation: step .32s ease-in-out infinite alternate-reverse; }
      .cat[data-phase="rest"] { animation: breathe 1.7s ease-in-out infinite alternate; }
      @keyframes tail-swish { to { transform: rotate(13deg); } }
      @keyframes step { to { transform: rotate(15deg) translateY(-1px); } }
      @keyframes breathe { to { margin-top: 2px; } }
      @media (prefers-reduced-motion: reduce) { .cat, .cat * { animation: none !important; } }
    </style>
  </head>
  <body>
    <h1>hi medha</h1>
    <div class="cat" data-cat="ginger" aria-hidden="true">
      <svg viewBox="0 0 84 62">
        <g class="tail"><path d="M17 39C2 38 3 19 13 20c7 0 3 10-2 9" fill="none" stroke="#d87932" stroke-width="7" stroke-linecap="round"/></g>
        <ellipse cx="41" cy="38" rx="27" ry="16" fill="#e99145" stroke="#4a3026" stroke-width="2"/>
        <path d="M56 20l5-11 6 10M72 20l7-10 1 16" fill="#e99145" stroke="#4a3026" stroke-width="2" stroke-linejoin="round"/>
        <circle cx="67" cy="28" r="15" fill="#e99145" stroke="#4a3026" stroke-width="2"/>
        <path d="M58 31l-10 1m28 0 8 1M61 20l3 5m8-5-2 5" fill="none" stroke="#9f5226" stroke-width="2" stroke-linecap="round"/>
        <circle cx="63" cy="28" r="1.6" fill="#38251e"/><circle cx="72" cy="28" r="1.6" fill="#38251e"/>
        <path d="M66 32l2 2 2-2" fill="#fff0e2" stroke="#4a3026" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M28 27v12m11-15v14" stroke="#9f5226" stroke-width="3" stroke-linecap="round"/>
        <g class="leg leg-a"><path d="M29 48v10h-8" fill="none" stroke="#d87932" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
        <g class="leg leg-b"><path d="M50 48v10h8" fill="none" stroke="#d87932" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
      </svg>
    </div>
    <div class="cat" data-cat="black" aria-hidden="true">
      <svg viewBox="0 0 84 62">
        <g class="tail"><path d="M18 40C1 43 1 22 11 19c8-2 7 9 0 11" fill="none" stroke="#262329" stroke-width="7" stroke-linecap="round"/></g>
        <ellipse cx="41" cy="38" rx="27" ry="16" fill="#29262d" stroke="#4a3026" stroke-width="2"/>
        <path d="M56 20l5-11 6 10M72 20l7-10 1 16" fill="#29262d" stroke="#4a3026" stroke-width="2" stroke-linejoin="round"/>
        <circle cx="67" cy="28" r="15" fill="#29262d" stroke="#4a3026" stroke-width="2"/>
        <path d="M58 32l-10 1m28-1 8 1" fill="none" stroke="#4a3026" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="63" cy="28" r="1.8" fill="#efd76d"/><circle cx="72" cy="28" r="1.8" fill="#efd76d"/>
        <path d="M66 32l2 2 2-2M54 38q13 11 25 0" fill="#faf2dd" stroke="#4a3026" stroke-width="1.2" stroke-linejoin="round"/>
        <g class="leg leg-a"><path d="M29 48v10h-8" fill="none" stroke="#262329" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
        <g class="leg leg-b"><path d="M50 48v10h8" fill="none" stroke="#262329" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
      </svg>
    </div>
    <script>
      (() => {
        const SIZE = 70;
        const PAD = 10;
        const heading = document.querySelector('h1');
        const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
        const cats = [...document.querySelectorAll('.cat')].map((element, index) => ({
          element,
          x: index ? innerWidth - SIZE - 18 : 18,
          y: innerHeight - 72,
          targetX: 0,
          targetY: 0,
          speed: index ? 58 : 52,
          phase: 'rest',
          phaseTime: 0.8 + index * 0.5,
          direction: index ? -1 : 1
        }));

        const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

        function blocked(x, y) {
          const rect = heading.getBoundingClientRect();
          return x + SIZE > rect.left - 16 && x < rect.right + 16 &&
            y + 54 > rect.top - 14 && y < rect.bottom + 14;
        }

        function randomTarget(cat) {
          for (let tries = 0; tries < 24; tries += 1) {
            const x = PAD + Math.random() * Math.max(0, innerWidth - SIZE - PAD * 2);
            const y = PAD + Math.random() * Math.max(0, innerHeight - 54 - PAD * 2);
            if (!blocked(x, y)) return { x, y };
          }
          return { x: cat.x, y: cat.y };
        }

        function enterPhase(cat, phase) {
          cat.phase = phase;
          cat.element.dataset.phase = phase;
          if (phase === 'rest') cat.phaseTime = 0.8 + Math.random() * 1.6;
          if (phase === 'walk') {
            cat.phaseTime = 3 + Math.random() * 3;
            const target = randomTarget(cat);
            Object.assign(cat, { targetX: target.x, targetY: target.y });
          }
          if (phase === 'play') cat.phaseTime = 2.4 + Math.random() * 1.5;
        }

        function move(cat, targetX, targetY, dt) {
          targetX = clamp(targetX, PAD, Math.max(PAD, innerWidth - SIZE - PAD));
          targetY = clamp(targetY, PAD, Math.max(PAD, innerHeight - 54 - PAD));
          const dx = targetX - cat.x;
          const dy = targetY - cat.y;
          const distance = Math.hypot(dx, dy);
          if (distance < 2) return true;
          const step = Math.min(distance, cat.speed * dt * (cat.phase === 'play' ? 1.35 : 1));
          const nextX = clamp(cat.x + dx / distance * step, PAD, Math.max(PAD, innerWidth - SIZE - PAD));
          const nextY = clamp(cat.y + dy / distance * step, PAD, Math.max(PAD, innerHeight - 54 - PAD));
          if (blocked(nextX, nextY)) return true;
          cat.x = nextX;
          cat.y = nextY;
          if (Math.abs(dx) > 1) cat.direction = dx < 0 ? -1 : 1;
          return step === distance;
        }

        function render(cat) {
          cat.element.style.transform = `translate3d(${cat.x}px, ${cat.y}px, 0) scaleX(${cat.direction})`;
        }

        function placeCats() {
          cats.forEach((cat, index) => {
            cat.x = clamp(cat.x, PAD, Math.max(PAD, innerWidth - SIZE - PAD));
            cat.y = clamp(cat.y, PAD, Math.max(PAD, innerHeight - 54 - PAD));
            if (blocked(cat.x, cat.y)) {
              cat.x = index ? innerWidth - SIZE - 18 : 18;
              cat.y = innerHeight - 72;
            }
            render(cat);
          });
        }

        let lastTime = null;
        let frameId = 0;
        function frame(time) {
          if (document.hidden || reducedMotion.matches) {
            lastTime = null;
            frameId = 0;
            return;
          }
          const dt = Math.min((time - (lastTime ?? time)) / 1000, 0.05);
          lastTime = time;
          cats.forEach((cat, index) => {
            cat.phaseTime -= dt;
            if (cat.phase === 'walk' && move(cat, cat.targetX, cat.targetY, dt)) cat.phaseTime = 0;
            if (cat.phase === 'play') {
              const friend = cats[1 - index];
              move(cat, friend.x + (index ? 34 : -34), friend.y + (index ? -12 : 12), dt);
            }
            if (cat.phaseTime <= 0) {
              enterPhase(cat, cat.phase === 'walk' ? 'rest' : cat.phase === 'rest' ? 'play' : 'walk');
            }
            render(cat);
          });
          frameId = requestAnimationFrame(frame);
        }

        function start() {
          if (frameId) cancelAnimationFrame(frameId);
          frameId = 0;
          lastTime = null;
          placeCats();
          if (!document.hidden && !reducedMotion.matches) frameId = requestAnimationFrame(frame);
        }

        addEventListener('resize', placeCats);
        document.addEventListener('visibilitychange', start);
        reducedMotion.addEventListener('change', start);
        cats.forEach(cat => enterPhase(cat, 'walk'));
        start();
      })();
    </script>
  </body>
</html>
