      body { margin: 0; }
      .hero { height: 100svh; }
      .center-gif, .full-gif { position: fixed; inset: 0; width: 100vw; height: 100svh; object-fit: cover; object-position: center; display: block; z-index: 0; }
      .scroll-section { position: relative; z-index: 1; min-height: 100svh; background: url("scrollbg.png") no-repeat center center; background-size: cover; overflow: hidden; }
      .scroll-section .choc, .scroll-section .allchoc { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; pointer-events: none; }
      .scroll-section .choc { cursor: pointer; pointer-events: auto; }

  </head>
  <body>
    <section class="hero">
      <img class="center-gif" src="catmint.gif" alt="Animated mint cat">
      <img class="full-gif" src="sparksmint.gif" alt="Mint sparkles">
    </section>
    <section class="scroll-section" aria-label="Scrolled content">
      <img id="choc" class="choc" src="choc1.png" alt="Chocolate">
      <img class="allchoc" src="allchoc.png" alt="All chocolates">
    </section>
    <script>
      (() => {
        const stages = ["choc1.png", "choc2.png", "choc3.png", "choc4.png"];
        const choc = document.getElementById("choc");
        stages.forEach((src) => { const img = new Image(); img.src = src; });
        choc.addEventListener("click", () => {
          const current = choc.getAttribute("src");
          const next = stages[(stages.indexOf(current) + 1) % stages.length];
          choc.setAttribute("src", next);
        });
      })();
    </script>
  </body>
